[workspace]
members = [
    "crates/carta-format",
    "crates/carta-core",
    "crates/carta-cli",
    "crates/carta-tui",
]
exclude = ["experiments/keyboard-events"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"

[workspace.dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.5.48", features = ["derive"] }
crossterm = "0.28.1"
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = "0.29.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["arbitrary_precision"] }
tempfile = "3.23.0"
thiserror = "2.0.17"
unicode-casefold = "0.2.0"
unicode-normalization = "0.1.24"
uuid = { version = "1.18.1", features = ["serde", "v7"] }
zip = { version = "2.2.2", default-features = false, features = ["deflate"] }
