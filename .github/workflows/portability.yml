name: Portability

on:
  push:
    branches:
      - main
      - opencode/v0.2
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Rust quality (fmt + Clippy)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            libwayland-dev \
            pkg-config

      - name: Install Rust 1.85 quality components
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component clippy --component rustfmt
          rustup override set 1.85.0

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  linux-glibc:
    name: Linux x86_64 (Ubuntu 20.04 baseline)
    runs-on: ubuntu-22.04
    container: ubuntu:20.04

    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            ca-certificates \
            curl \
            git \
            libwayland-dev \
            pkg-config

      - uses: actions/checkout@v7

      - name: Install Rust 1.85
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain 1.85.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Test workspace
        run: cargo test --workspace --locked

      - name: Build release binaries
        run: cargo build --release --workspace --locked

      - name: Smoke test binaries
        run: |
          target/release/carta --version
          target/release/carta-cli --version
          git --version
          ldd target/release/carta
          ldd target/release/carta-cli

  alpine-source:
    name: Alpine Linux source build
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: Build and test on Alpine
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            alpine:3.24 \
            sh -euxc '
              apk add --no-cache build-base cargo git pkgconf rust wayland-dev
              git config --global --add safe.directory /src
              cargo test --workspace --locked
              cargo build --release --workspace --locked
              target/release/carta --version
              target/release/carta-cli --version
              git --version
            '

  macos:
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64

    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.85
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup override set 1.85.0

      - name: Test workspace
        run: cargo test --workspace --locked

      - name: Build release binaries
        run: cargo build --release --workspace --locked

      - name: Smoke test binaries
        run: |
          ./target/release/carta --version
          ./target/release/carta-cli --version
          git --version
          file ./target/release/carta
          file ./target/release/carta-cli
