name: One-time background sync verification
on:
  push:
    branches: [opencode/v0.2]
    paths: [".github/workflows/sync-verify-once.yml"]
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'fnt400/carta-space'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libwayland-dev
      - name: Verify workspace and GUI, capture sanitized report
        shell: bash
        run: |
          set +e
          timeout 1800 bash scripts/verify-carta.sh > /tmp/carta-verify.log 2>&1
          rc=$?
          set -e
          mkdir -p bugfixes
          {
            echo "# Background sync compile/test verification"
            echo
            echo "Tested base: ${GITHUB_SHA}"
            echo "Date: 2026-10-08"
            echo "Exit code: ${rc}"
            echo
            if [ "$rc" -eq 0 ]; then
              echo "Result: PASS"
            else
              echo "Result: FAIL or BLOCKED — inspect below"
            fi
            echo
            echo "```text"
            tail -n 120 /tmp/carta-verify.log | sed -E 's|/home/runner/[^ /]+|/home/runner/REDACTED|g'
            echo "```"
          } > bugfixes/background-sync-ci-result.md
          git add bugfixes/background-sync-ci-result.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Record background sync build verification result'
          git push origin HEAD:opencode/v0.2
