name: One-time background sync formatting
on:
  push:
    branches: [opencode/v0.2]
    paths: [".github/workflows/sync-verify-once.yml"]
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'fnt400/carta-space'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Commit verified Rust formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --manifest-path crates/carta-gui/Cargo.toml
          git add -- crates/carta-app/src crates/carta-core/src crates/carta-gui/src
          if git diff --cached --quiet; then
            echo "No Rust formatting changes."
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Format verified asynchronous archive sync implementation'
          git push origin HEAD:opencode/v0.2
