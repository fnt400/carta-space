name: One-time background sync verification
on:
  push:
    branches: [opencode/v0.2]
    paths: [".github/workflows/sync-verify-once.yml"]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'fnt400/carta-space'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libwayland-dev
      - name: Verify workspace and GUI
        shell: bash
        run: |
          set -u
          cargo fmt --all
          cargo fmt --manifest-path crates/carta-gui/Cargo.toml
          timeout 1800 bash scripts/verify-carta.sh > /tmp/carta-verify.log 2>&1
          result=$?
          echo "CARTA_VERIFY_EXIT_CODE=$result"
          echo "=== Tail of full verification ==="
          tail -n 160 /tmp/carta-verify.log
          exit "$result"
