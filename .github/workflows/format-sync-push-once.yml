name: One-time format automatic push
on:
  push:
    branches: [opencode/v0.2]
    paths: [.github/workflows/format-sync-push-once.yml]
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'fnt400/carta-space'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply Rustfmt and commit only if needed
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --manifest-path crates/carta-gui/Cargo.toml
          git add crates/carta-app/src crates/carta-core/src crates/carta-gui/src
          if git diff --cached --quiet; then
            echo "Rust formatting already clean"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Format immediate background push and persistent sync warning'
          git push origin HEAD:opencode/v0.2
