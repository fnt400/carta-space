name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare draft release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches Cargo version
        run: |
          version="$(awk '
            /^\[workspace\.package\]$/ { in_package = 1; next }
            /^\[/ { in_package = 0 }
            in_package && $1 == "version" && $2 == "=" {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.toml)"
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            cat > /tmp/release-notes.md <<'EOF'
          Carta Space v0.1.2 is the final terminal-interface release before development moves to the graphical frontend in v0.2.

          - Adds backlink indexing, persistent backlink cache, and backlink navigation.
          - Adds built-in PDF publication through Typst.
          - Includes the latest Canon Cat selection, text-movement, Wipe, and interaction fixes.
          - Retains portable Linux, macOS, and native Nix/NixOS packaging.

          The terminal frontend is frozen at v0.1.2. The macOS binaries are currently not Apple Developer signed or notarized.
          EOF
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --title "Carta Space $GITHUB_REF_NAME" \
              --notes-file /tmp/release-notes.md
          fi

  linux:
    name: Package Linux x86_64
    needs: prepare
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: Build on Ubuntu 20.04
        run: |
          docker run --rm \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            ubuntu:20.04 \
            bash -euxc '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                build-essential ca-certificates curl git libwayland-dev pkg-config
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --profile minimal --default-toolchain 1.85.0
              export PATH="$HOME/.cargo/bin:$PATH"
              cargo test --workspace --locked
              cargo build --release --workspace --locked
              target/release/carta --version
              target/release/carta-cli --version
              chown -R "$HOST_UID:$HOST_GID" target
            '

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          package="carta-v${version}-linux-x86_64"
          mkdir -p "dist/$package/LICENSES"
          install -m 755 target/release/carta "dist/$package/carta"
          install -m 755 target/release/carta-cli "dist/$package/carta-cli"
          install -m 644 README.md "dist/$package/README.md"
          install -m 644 INSTALL.md "dist/$package/INSTALL.md"
          install -m 644 LICENSE "dist/$package/LICENSE"
          install -m 644 LICENSES.md "dist/$package/LICENSES.md"
          install -m 644 LICENSES/CC0-1.0.txt "dist/$package/LICENSES/CC0-1.0.txt"
          install -m 644 LICENSES/OFL-source-serif.txt "dist/$package/LICENSES/OFL-source-serif.txt"
          install -m 644 LICENSES/OFL-source-code-pro.txt "dist/$package/LICENSES/OFL-source-code-pro.txt"
          install -m 644 LICENSES/OFL-noto-fonts.txt "dist/$package/LICENSES/OFL-noto-fonts.txt"
          install -m 644 LICENSES/OFL-noto-cjk.txt "dist/$package/LICENSES/OFL-noto-cjk.txt"
          tar -C dist -czf "dist/$package.tar.gz" "$package"
          (cd dist && sha256sum "$package.tar.gz" > "$package.tar.gz.sha256")

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" \
            "dist/carta-v${version}-linux-x86_64.tar.gz" \
            "dist/carta-v${version}-linux-x86_64.tar.gz.sha256" \
            --clobber

  macos:
    name: Package macOS (${{ matrix.arch }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64

    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.85
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup override set 1.85.0

      - name: Test and build
        run: |
          cargo test --workspace --locked
          cargo build --release --workspace --locked
          ./target/release/carta --version
          ./target/release/carta-cli --version

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          package="carta-v${version}-macos-${{ matrix.arch }}"
          mkdir -p "dist/$package/LICENSES"
          install -m 755 target/release/carta "dist/$package/carta"
          install -m 755 target/release/carta-cli "dist/$package/carta-cli"
          install -m 644 README.md "dist/$package/README.md"
          install -m 644 INSTALL.md "dist/$package/INSTALL.md"
          install -m 644 LICENSE "dist/$package/LICENSE"
          install -m 644 LICENSES.md "dist/$package/LICENSES.md"
          install -m 644 LICENSES/CC0-1.0.txt "dist/$package/LICENSES/CC0-1.0.txt"
          install -m 644 LICENSES/OFL-source-serif.txt "dist/$package/LICENSES/OFL-source-serif.txt"
          install -m 644 LICENSES/OFL-source-code-pro.txt "dist/$package/LICENSES/OFL-source-code-pro.txt"
          install -m 644 LICENSES/OFL-noto-fonts.txt "dist/$package/LICENSES/OFL-noto-fonts.txt"
          install -m 644 LICENSES/OFL-noto-cjk.txt "dist/$package/LICENSES/OFL-noto-cjk.txt"
          tar -C dist -czf "dist/$package.tar.gz" "$package"
          (cd dist && shasum -a 256 "$package.tar.gz" > "$package.tar.gz.sha256")

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" \
            "dist/carta-v${version}-macos-${{ matrix.arch }}.tar.gz" \
            "dist/carta-v${version}-macos-${{ matrix.arch }}.tar.gz.sha256" \
            --clobber

  publish:
    name: Publish release
    needs:
      - linux
      - macos
    runs-on: ubuntu-latest

    steps:
      - name: Publish draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
